<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parse · model stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=block">
<style>
/* Parse · model stack (1280x720). Same tokens as the agentic film: navy hero, Inter Tight + IBM Plex Mono, gold for
   the model at work. Every animated property is written by seek(t); CSS animation is off. */
*, *::before, *::after { animation: none !important; transition: none !important; box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #050a1c; --panel: #0b1124; --panel-2: #10182f;
  --ink: #f3f3f3; --mute: rgba(243,243,243,.66); --faint: rgba(243,243,243,.42); --ghost: rgba(243,243,243,.16);
  --hair: rgba(255,255,255,.12); --hair-2: rgba(255,255,255,.26);
  --gold: #d0a650; --gold-soft: rgba(208,166,80,.16); --blue: #4f7dff; --ok: #5cc58a; --warn: #e3ac4a;
  --sans: "Inter Tight", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--navy); }
body { color: var(--ink); font: 400 16px/1.4 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
#stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--navy); }
.bg { position: absolute; inset: 0;
  background: radial-gradient(60% 70% at 22% 28%, rgba(36,74,165,.40), transparent 70%),
              radial-gradient(52% 58% at 84% 88%, rgba(36,74,165,.24), transparent 70%), var(--navy); }
.dots { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.2px); background-size: 24px 24px; }
.strip { position: absolute; left: 0; right: 0; top: 0; height: 44px; background: #060d24; display: flex; align-items: center;
  justify-content: space-between; padding: 0 56px; font: 500 13px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #a3abc4; z-index: 5; }
.strip b { color: #fff; font-weight: 500; }
.strip .sq { display: inline-block; width: 8px; height: 8px; background: var(--gold); margin-right: 12px; vertical-align: 1px; }

.card { position: absolute; inset: 0; visibility: hidden; }
.card.on { visibility: visible; }
.eyebrow { position: absolute; left: 56px; top: 84px; font: 500 15px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.eyebrow b { color: var(--gold); font-weight: 500; margin-right: 14px; }
.model { position: absolute; left: 56px; top: 106px; font: 300 68px/76px var(--sans); letter-spacing: -.015em; white-space: nowrap; }
.model small { font: 500 15px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-left: 18px; vertical-align: 10px; }
.tuned { position: absolute; left: 56px; top: 200px; white-space: nowrap; display: flex; align-items: baseline; gap: 16px; }
.tuned .k { font: 500 13px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.tuned .v { font: 400 22px/1.2 var(--sans); color: var(--mute); }

.panel { position: absolute; top: 284px; height: 306px; width: 548px; background: linear-gradient(180deg, #10182f, #0b1124); border: 1px solid var(--hair); }
.panel.l { left: 56px; } .panel.r { left: 676px; }
.panel .tag { position: absolute; left: 24px; top: 20px; font: 500 13px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.panel .tag b { color: var(--mute); font-weight: 500; }
.panel .bd { position: absolute; left: 24px; right: 24px; top: 58px; bottom: 20px; }
.arrow { position: absolute; left: 614px; top: 436px; width: 52px; height: 2px; background: var(--hair-2); }
.arrow::after { content: ""; position: absolute; right: -1px; top: -5px; border-left: 9px solid var(--hair-2); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.arrow i { position: absolute; top: -3px; left: 0; width: 8px; height: 8px; background: var(--gold); }

.tx { font: 400 27px/1.34 var(--sans); color: var(--ink); }
.tx .rest { opacity: 0; }
.hl { border-bottom: 2px solid var(--gold); }
.rest .hl { border-color: transparent; }
.caret { display: inline-block; width: 0; height: 1em; position: relative; vertical-align: -.12em; }
.caret::after { content: ""; position: absolute; left: 1px; top: 0; bottom: 0; width: 2px; background: var(--gold); }
.pre { white-space: pre; font-family: var(--mono); }

.pill { display: inline-block; font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 6px 9px; border: 1px solid var(--hair-2); color: var(--mute); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: rgba(92,197,138,.5); background: rgba(92,197,138,.12); }
.pill.gold { color: var(--gold); border-color: rgba(208,166,80,.55); background: var(--gold-soft); }
.pill.warn { color: var(--warn); border-color: rgba(227,172,74,.5); background: rgba(227,172,74,.14); }
.abs { position: absolute; }

/* card 2: image */
.shot { position: relative; height: 226px; border: 1px solid var(--hair); background: #0a1020; overflow: hidden; }
.shot .hdr { position: absolute; left: 14px; top: 9px; font: 500 12px/1 var(--mono); letter-spacing: .08em; color: rgba(243,243,243,.5); }
.shot .photo { position: absolute; left: 0; right: 0; top: 30px; bottom: 0;
  background: radial-gradient(55% 75% at 28% 38%, #3b4659 0%, transparent 62%), radial-gradient(48% 70% at 74% 52%, #2b3445 0%, transparent 66%), linear-gradient(180deg, #1a2231, #0c121d); }
.shot .banner { position: absolute; left: 0; right: 0; bottom: 22px; height: 66px; background: #a42f1f; padding: 9px 16px; font: 600 25px/1.12 var(--sans); letter-spacing: .01em; color: #fff; }
.shot .scan { position: absolute; left: 0; right: 0; height: 2px; background: var(--gold); top: 0; }
.shot .scan::before { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 54px; background: linear-gradient(0deg, rgba(208,166,80,.20), transparent); }
.ocr { position: absolute; left: 0; font: 500 27px/1 var(--mono); color: var(--ink); white-space: nowrap; }
.ocr .n { font: 500 12px var(--mono); color: var(--faint); letter-spacing: .1em; margin-right: 16px; vertical-align: 3px; }

/* card 3: bars */
.brow { position: absolute; left: 0; right: 0; height: 22px; display: flex; align-items: center; }
.brow .k { width: 40px; font: 500 14px var(--mono); color: var(--faint); }
.brow .track { position: relative; width: 262px; height: 8px; background: rgba(255,255,255,.07); }
.brow .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(243,243,243,.34); }
.brow.hot .k { color: var(--gold); }
.brow.hot .bar { background: var(--gold); }
.brow .val { margin-left: 12px; font: 500 14px var(--mono); color: var(--gold); letter-spacing: .06em; white-space: nowrap; }
.thr { position: absolute; left: 171px; top: -6px; height: 232px; border-left: 1px dashed rgba(255,255,255,.34); }
.thrl { position: absolute; left: 171px; top: 228px; transform: translateX(-50%); font: 500 11px var(--mono); letter-spacing: .1em; color: var(--faint); white-space: nowrap; text-transform: uppercase; }

/* card 4: posts */
.post { position: absolute; left: 0; right: 0; height: 52px; }
.post .h { font: 400 18px/1.25 var(--sans); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.post .m { margin-top: 6px; font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.post .m b { color: var(--mute); font-weight: 500; }
.post .m em { font-style: normal; color: var(--gold); }
.story { position: absolute; left: 330px; top: 74px; white-space: nowrap; }
.story .a { font: 500 13px var(--mono); letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
.story .b { margin-top: 8px; font: 500 12px var(--mono); letter-spacing: .1em; color: var(--faint); text-transform: uppercase; }

/* card 5: evidence */
.ev { position: absolute; left: 0; right: 0; height: 56px; border-top: 1px solid var(--hair); padding-top: 11px; }
.ev .w { font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.ev .s { margin-top: 8px; font: 400 18px/1.2 var(--sans); color: var(--mute); width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .pill { position: absolute; right: 0; top: 22px; }

/* rail */
.rail { position: absolute; left: 56px; right: 56px; top: 628px; height: 40px; display: flex; gap: 16px; z-index: 4; }
.rail .seg { flex: 1; position: relative; padding-top: 14px; font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.rail .seg::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.14); }
.rail .seg .f { position: absolute; left: 0; top: 0; height: 2px; background: var(--gold); width: 0; }
.rail .seg b { color: inherit; font-weight: 500; margin-right: 10px; }
.rail .seg.on { color: #fff; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div class="dots"></div>
  <div class="strip"><span><i class="sq"></i><b>PARSE</b> · MODEL STACK</span><span>EXAMPLE · CANAL INCIDENT · 29 NOV 2024</span></div>
  <div id="cards"></div>
  <div class="rail" id="rail"></div>
</div>
<script>
(() => {
const D = 2.6, N = 6, T = D * N, PHASE = 1.8;           // t = 0 sits at 1.8 s into card 1, fully built: the poster frame and the loop seam
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const rv = (el, lt, s, d = .5, dy = 16, dx = 0) => { if (!el) return; const p = eo((lt - s) / d); el.style.opacity = p; el.style.transform = `translate(${(1 - p) * dx}px,${(1 - p) * dy}px)`; };
function typed(el, segs, lt, s, cps, caret = true) {
  const full = segs.map(x => x[0]).join('');
  const n = Math.max(0, Math.min(full.length, Math.floor((lt - s) * cps)));
  let used = 0, a = '', b = '';
  for (const [t, c] of segs) {
    const k = Math.max(0, Math.min(t.length, n - used));
    const head = esc(t.slice(0, k)), tail = esc(t.slice(k));
    a += c ? `<span class="${c}">${head}</span>` : head;
    b += c ? `<span class="${c}">${tail}</span>` : tail;
    used += t.length;
  }
  const show = caret && lt >= s && n < full.length;
  el.innerHTML = a + (show ? '<span class="caret"></span>' : '') + `<span class="rest">${b}</span>`;
}

const META = [
  { n: '01', role: 'Translate',   model: 'Qwen3-4B',            suffix: '',            tuned: 'Kosovo news + Telegram · sq · sr · ru → en', rail: 'Translate' },
  { n: '02', role: 'Read images', model: 'LightOnOCR-2-1B',     suffix: '',            tuned: 'Post screenshots, banners, scanned notices', rail: 'Read' },
  { n: '03', role: 'Detect',      model: 'Qwen3.5-4B',          suffix: 'threat head', tuned: 'Analyst-labelled posts · ten threat types',  rail: 'Detect' },
  { n: '04', role: 'Match',       model: 'Qwen3-Embedding-0.6B', suffix: '',           tuned: 'Same story in four languages, four outlets', rail: 'Match' },
  { n: '05', role: 'Check claims', model: 'Qwen3.5-4B',         suffix: 'stance head', tuned: 'Official statements vs. social posts',       rail: 'Check' },
  { n: '06', role: 'Teach',       model: 'Qwen3-8B',            suffix: '',            tuned: 'Hard cases the small models disagree on',    rail: 'Teach' },
];

const SR = 'Снажна експлозија у <span class="hl">Зубином Потоку</span>: Прекинуто снабдевање водом за пиће, Грачаница без струје';
const EN = [['Powerful explosion in ', ''], ['Zubin Potok', 'hl'], [': drinking water supply cut off, Gračanica without power', '']];
const CLAIM = '“Drinking water to <span class="hl">Zubin Potok</span> was cut after the Ibar-Lepenac canal blast.”';
const JSONSEG = [['{\n  "labels": ["T3"],\n  "is_threat_relevant": true,\n  "places": ["', ''], ['Зубином Потоку', 'hl'], ['"],\n  "offline_intent": false\n}', '']];

const BODY = [
/* 0 translate */ `
  <div class="panel l"><div class="tag"><b>SR-CYRL</b> · Sputnik Srbija · 19:47 UTC</div><div class="bd"><div class="tx" data-r="in" style="font-size:30px">${SR}</div></div></div>
  <div class="arrow"><i></i></div>
  <div class="panel r"><div class="tag"><b>EN</b> · translated</div><div class="bd"><div class="tx" data-r="out" style="font-size:30px"></div></div></div>`,
/* 1 read images */ `
  <div class="panel l"><div class="tag"><b>IMAGE</b> · telegram screenshot</div><div class="bd">
    <div class="shot" data-r="shot"><div class="hdr">@channel · 19:47</div><div class="photo"></div><div class="banner">ЕКСПЛОЗИЈА У<br>ЗУБИНОМ ПОТОКУ</div><div class="scan" data-r="scan"></div></div></div></div>
  <div class="arrow"><i></i></div>
  <div class="panel r"><div class="tag"><b>TEXT FOUND</b> · 3 lines · cyrillic</div><div class="bd">
    <div class="ocr" data-r="o0" style="top:14px"><span class="n">01</span><span class="v"></span></div>
    <div class="ocr" data-r="o1" style="top:74px"><span class="n">02</span><span class="v"></span></div>
    <div class="ocr" data-r="o2" style="top:128px"><span class="n">03</span><span class="v"></span></div></div></div>`,
/* 2 detect */ `
  <div class="panel l"><div class="tag"><b>EN</b> · input</div><div class="bd"><div class="tx" data-r="in" style="font-size:30px">Powerful explosion in <span class="hl">Zubin Potok</span>: drinking water supply cut off, Gračanica without power</div></div></div>
  <div class="arrow"><i></i></div>
  <div class="panel r"><div class="tag"><b>THREAT TYPE</b> · calibrated probability</div><div class="bd" data-r="bars">
    <div class="thr"></div><div class="thrl">0.50 · flag</div></div></div>`,
/* 3 match */ `
  <div class="panel l"><div class="tag"><b>4 POSTS</b> · 4 outlets</div><div class="bd" data-r="posts"></div></div>
  <div class="arrow"><i></i></div>
  <div class="panel r"><div class="tag"><b>EMBEDDING SPACE</b> · 1024-d</div><div class="bd" data-r="space">
    <svg width="500" height="228" viewBox="0 0 500 228" style="position:absolute;left:0;top:0"></svg>
    <div class="story" data-r="story"><div class="a">One story</div><div class="b">4 posts · 4 outlets</div></div></div></div>`,
/* 4 check claims */ `
  <div class="panel l"><div class="tag"><b>CLAIM</b> · extracted from 4 posts</div><div class="bd"><div class="tx" data-r="claim" style="font-size:30px">${CLAIM}</div>
    <div class="abs" data-r="c0" style="left:0;top:156px;white-space:nowrap"><span class="pill"><span style="color:var(--faint)">Where</span>&nbsp;&nbsp;Zubin Potok</span><span class="pill" style="margin-left:8px"><span style="color:var(--faint)">When</span>&nbsp;&nbsp;29 Nov 2024</span></div>
    <div class="abs" data-r="c1" style="left:0;top:194px;white-space:nowrap"><span class="pill"><span style="color:var(--faint)">What</span>&nbsp;&nbsp;Water supply cut</span></div></div></div>
  <div class="arrow"><i></i></div>
  <div class="panel r"><div class="tag"><b>STANCE</b> · evidence</div><div class="bd" data-r="evs">
    <div class="ev" data-r="e0" style="top:0"><div class="w">KoSSev · Tier 1</div><div class="s">Damaged canal cuts the water supply</div><span class="pill ok" data-r="p0">Supports</span></div>
    <div class="ev" data-r="e1" style="top:58px"><div class="w">Kurir · Tier 3</div><div class="s">Water supply cut after canal damage</div><span class="pill ok" data-r="p1">Supports</span></div>
    <div class="ev" data-r="e2" style="top:116px"><div class="w">Pristina outlet · Tier 1</div><div class="s">Opposition holds rally against the budget</div><span class="pill" data-r="p2">Unrelated</span></div>
    <div class="abs" data-r="verdict" style="left:0;top:188px"><span class="pill ok" style="font-size:14px;padding:9px 13px">Corroborated</span></div></div></div>`,
/* 5 teach */ `
  <div class="panel l"><div class="tag"><b>HARD CASE</b> · small models unsure</div><div class="bd">
    <div class="tx" data-r="in" style="font-size:21px;line-height:1.36">Снажна експлозија у Зубином Потоку: Прекинуто снабдевање водом за пиће, Грачаница без струје</div>
    <div class="abs" data-r="vote" style="left:0;top:128px;white-space:nowrap"><span class="mono" style="font:500 13px var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin-right:12px">classifier</span><span class="pill warn">T3 · 0.55</span><span class="pill" style="margin-left:8px">Uncertain</span></div>
    <div class="abs" data-r="esc" style="left:0;top:172px;font:500 13px var(--mono);letter-spacing:.1em;color:var(--gold);text-transform:uppercase;white-space:nowrap">↳ escalated to the teacher</div></div></div>
  <div class="arrow"><i></i></div>
  <div class="panel r"><div class="tag"><b>QWEN3-8B</b> · label-v1</div><div class="bd">
    <div class="tx pre" data-r="json" style="font-size:21px;line-height:1.5"></div>
    <div class="abs" data-r="gold" style="left:0;top:204px"><span class="pill gold">Trains the small models</span></div></div></div>`,
];

/* ---- build ------------------------------------------------------------ */
const cardsEl = document.getElementById('cards'), railEl = document.getElementById('rail');
const cards = META.map((m, i) => {
  const c = document.createElement('div'); c.className = 'card'; c.id = 'c' + i;
  c.innerHTML = `<div class="eyebrow" data-r="eb"><b>${m.n}</b>— ${m.role}</div>
    <div class="model" data-r="md">${m.model}${m.suffix ? `<small>${m.suffix}</small>` : ''}</div>
    <div class="tuned" data-r="tn"><span class="k">Tuned on</span><span class="v">${m.tuned}</span></div>` + BODY[i];
  cardsEl.appendChild(c);
  return c;
});
const segs = META.map(m => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = `<i class="f"></i><b>${m.n}</b>${m.rail}`; railEl.appendChild(s); return s; });
const Q = (i, r) => cards[i].querySelector(`[data-r="${r}"]`);
const panels = cards.map(c => ({ l: c.querySelector('.panel.l'), r: c.querySelector('.panel.r'), a: c.querySelector('.arrow') }));

/* matching scene geometry (card 4) */
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const CX = 275, CY = 117, CR = 36;
const ghosts = [];
while (ghosts.length < 22) {                                  // keep the ring and the label clear of background dots
  const x = 30 + rnd() * 440, y = 20 + rnd() * 188, r = 2.5 + rnd() * 2;
  if (Math.hypot(x - CX, y - CY) < 64) continue;
  if (x > 318 && y > 52 && y < 128) continue;
  ghosts.push([x, y, r]);
}
const START = [[70, 66], [418, 54], [96, 178], [430, 168]];
const END = [[262, 108], [284, 112], [268, 126], [288, 124]];
const svg = Q(3, 'space').querySelector('svg');
svg.innerHTML = ghosts.map(([x, y, r]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="rgba(243,243,243,.16)"/>`).join('') +
  `<circle id="ring" cx="${CX}" cy="${CY}" r="${CR}" fill="none" stroke="#d0a650" stroke-width="1.5" transform="rotate(-90 ${CX} ${CY})"/>` +
  START.map((p, i) => `<circle class="g" cx="${p[0]}" cy="${p[1]}" r="6" fill="#d0a650"/>`).join('');
const gdots = [...svg.querySelectorAll('.g')], ring = svg.querySelector('#ring');
const RL = 2 * Math.PI * CR; ring.setAttribute('stroke-dasharray', RL);

/* posts (card 4 left) */
const POSTS = [
  ['Снажна експлозија у Зубином Потоку: Прекинуто снабдевање водом за пиће', '19:47', 'Sputnik Srbija', 'SR-CYRL'],
  ['Експлозија у Зубином Потоку, оштећен канал Ибар-Лепенац', '19:51', 'In4s', 'SR-CYRL'],
  ['EKSPLOZIJA U ZUBINOM POTOKU: Oštećen kanal Ibar-Lepenac (VIDEO)', '20:44', 'Kurir', 'SR-LATN'],
  ['Prekinuto vodosnabdevanje nakon oštećenja kanala Ibar-Lepenac', '20:56', 'KoSSev', 'SR-LATN'],
];
Q(3, 'posts').innerHTML = POSTS.map((p, i) => `<div class="post" data-r="po${i}" style="top:${i * 56}px"><div class="h">${p[0]}</div><div class="m">${p[1]} · <b>${p[2]}</b> · <em>${p[3]}</em></div></div>`).join('');

/* bars (card 3 right) */
const VALS = [.03, .02, .91, .05, .02, .07, .02, .01, .03, .04];
const barsEl = Q(2, 'bars');
VALS.forEach((v, i) => {
  const r = document.createElement('div'); r.className = 'brow' + (i === 2 ? ' hot' : ''); r.style.top = (i * 22.4) + 'px';
  r.innerHTML = `<span class="k">T${i + 1}</span><span class="track"><i class="bar"></i></span>${i === 2 ? '<span class="val">0.91 · sabotage</span>' : ''}`;
  barsEl.appendChild(r);
});
const brows = [...barsEl.querySelectorAll('.brow')];

/* ---- draw ------------------------------------------------------------- */
function common(i, lt) {
  rv(Q(i, 'eb'), lt, .00, .45, 10);
  rv(Q(i, 'md'), lt, .06, .55, 22);
  rv(Q(i, 'tn'), lt, .22, .50, 12);
  rv(panels[i].l, lt, .20, .55, 18);
  rv(panels[i].r, lt, .30, .55, 18);
