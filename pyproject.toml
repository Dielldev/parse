[project]
name = "atlas"
version = "0.1.0"
description = "Atlas: OSINT early-warning pipeline for Kosovo (MVP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "python-ulid>=2.7",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "lingua-language-detector>=2.0",
    "pillow>=10.0",
    "imagehash>=4.3",
    "python-dateutil>=2.9",
    "jinja2>=3.1.6",
    "playwright>=1.65.2",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "torch>=2.4",
    "pytesseract>=0.3",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
