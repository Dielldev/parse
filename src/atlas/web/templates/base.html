<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Atlas{% endblock %} · Atlas</title>
<script>try{var t=localStorage.getItem('atlas-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="/static/atlas.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232a77b4' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M3 6c6.5 0 7 6 12 6M3 18c6.5 0 7-6 12-6M3 12h18'/%3E%3C/svg%3E">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-mark" viewBox="0 0 24 24"><path class="f f1" d="M3 6c6.5 0 7 6 12 6"/><path class="f f2" d="M3 12h18"/><path class="f f3" d="M3 18c6.5 0 7-6 12-6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-flow" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7.4 11 16.6 6M7.4 13l9.2 5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M10 3.5 11.6 8 16 9.5l-4.4 1.6L10 15.5l-1.6-4.4L4 9.5 8.4 8z"/><path d="M18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h8l-1 8 9-12h-8z"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2 5.5 5.5 2-5.5 2L12 18l-2-5.5-5.5-2 5.5-2z"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="12" cy="19" r="2"/><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-rss" viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-6.5 18-4.5-7-7-4.5z"/></symbol>
    <symbol id="i-landmark" viewBox="0 0 24 24"><path d="M3 21h18M4 10h16M12 3 4 8h16zM6 10v8M10 10v8M14 10v8M18 10v8"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 4l14 16M19 4 5 20"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M22 21a7 7 0 0 0-4-6.3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 7v6M12 17v.01"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M10 2v4M14 2v4M10 18v4M14 18v4M2 10h4M2 14h4M18 10h4M18 14h4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-lang" viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c.8 3.5 3 6 6 7.5M11 5c-.8 3.5-3 6-6 7.5"/><path d="m12 21 4-9 4 9M13.5 18h5"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="rail" aria-label="Main">
    <a class="logo" href="/" aria-label="ATLAS home" title="ATLAS"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg></a>
    <nav>
      <a href="/" class="{{ 'on' if active == 'ask' }}" data-tip="Ask Atlas" aria-label="Ask Atlas"><svg><use href="#i-home"/></svg></a>
      <a href="/signals" class="{{ 'on' if active == 'signals' }}" data-tip="Signals" aria-label="Signals"><svg><use href="#i-activity"/></svg></a>
      <a href="/sources" class="{{ 'on' if active == 'sources' }}" data-tip="Sources" aria-label="Sources"><svg><use href="#i-database"/></svg></a>
      <a href="/how-it-works" class="{{ 'on' if active == 'how' }}" data-tip="Workflow" aria-label="Workflow"><svg><use href="#i-flow"/></svg></a>
      <a href="/overview" class="{{ 'on' if active == 'overview' }}" data-tip="Overview" aria-label="Overview"><svg><use href="#i-grid"/></svg></a>
    </nav>
    <div class="rail-foot"><span class="live-dot" data-tip="Local · read-only"></span></div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="model" id="model">
        <button type="button" class="model-btn" aria-haspopup="true" aria-expanded="false">
          <span>Atlas Retrieval</span><span class="badge-free">local · $0</span><svg class="ic sm"><use href="#i-chev"/></svg>
        </button>
        <div class="model-pop" role="menu">
          <div class="pop-h">Answer engine</div>
          <div class="pop-row on">
            <div><b>Atlas Retrieval</b><span>Search, rank and hash checks on this machine. No model calls.</span></div>
            <svg class="ic tick"><use href="#i-check"/></svg></div>
          <div class="pop-h">Pipeline models</div>
          {% for m in model_list() %}
          <div class="pop-row dim">
            <div><b>{{ m.role }}</b><span class="mono">{{ m.id }}</span></div>
            <span class="tag {{ 'ok' if m.local else '' }}">{{ 'local' if m.local else 'paid · approve' }}</span></div>
          {% endfor %}
        </div>
      </div>
      <div class="top-actions">
        <form class="top-search" action="/signals" method="get" role="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <input name="q" placeholder="Search signals" aria-label="Search signals">
        </form>
        <button type="button" class="icon-btn theme-btn" id="theme" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="ic sun"><use href="#i-sun"/></svg><svg class="ic moon"><use href="#i-moon"/></svg></button>
        <a class="btn-dark" href="/"><svg class="ic"><use href="#i-plus"/></svg><span>New thread</span></a>
      </div>
    </header>
    <main class="{% block mainclass %}page{% endblock %}">{% block body %}{% endblock %}</main>
  </div>
</div>
<script>
(() => {
  const m = document.getElementById('model'), b = m.querySelector('.model-btn');
  b.addEventListener('click', e => { e.stopPropagation(); const o = m.classList.toggle('open'); b.setAttribute('aria-expanded', o); });
  document.addEventListener('click', e => { if (!m.contains(e.target)) { m.classList.remove('open'); b.setAttribute('aria-expanded', false); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') m.classList.remove('open'); });
  const root = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)');
  document.getElementById('theme').addEventListener('click', () => {
    const now = root.dataset.theme || (dark.matches ? 'dark' : 'light'), next = now === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('atlas-theme', next); } catch (e) {}
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
